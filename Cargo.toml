[package]
name = "aqua-template-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Publisher-DID scoped registry for Aqua templates: publishers register signed Aqua trees, consumers subscribe and resolve by publisher DID or qualified name."
readme = "README.md"
keywords = ["aqua", "aqua-protocol", "registry", "template", "did"]
categories = ["development-tools", "web-programming::http-server"]
repository = "https://github.com/inblockio/aqua-template-registry"
exclude = ["target", "*.lock", ".vscode", ".idea"]

[[bin]]
name = "registryd"
path = "src/bin/registryd.rs"
required-features = ["server"]

[[bin]]
name = "publish-audit-set"
path = "src/bin/publish-audit-set.rs"
required-features = ["server"]

[[bin]]
name = "subscribe"
path = "src/bin/subscribe.rs"
required-features = ["client"]

[features]
default = ["server", "client"]
# HTTP surface: the axum router and the registryd binary.
server = ["dep:axum", "dep:tokio", "dep:tower"]
# Consumer side: the HTTP client, the subscriber, and the subscribe binary.
# Separate from `server` so a consumer that only imports templates does not
# have to build axum.
client = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:tokio"]

[dependencies]
# Dual path+version: local development resolves the sibling checkout, the
# published crate depends on the crates.io release.
aqua-rs-sdk-core = { path = "../aqua-rs-sdk-core", version = "0.1.1", features = ["native"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
hex = "0.4"

# Name rules (spec-type-registry.md 3.3) need real Unicode tables: NFC
# normalization and per-scalar script lookup. Hand-rolling either would
# silently diverge from the SDK's NameValidator.
unicode-normalization = "0.1"
unicode-script = "0.5"

# Optional, `server` feature only.
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }

# Optional, `client` feature only. All three already arrive under axum, so the
# `client` feature adds no new dependency subtree, only direct access to it.
# hyper's low-level http1 client is used rather than a batteries-included one:
# a subscriber polls a handful of endpoints on one origin, and every feature not
# present is one that cannot go wrong in a security-relevant path.
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

# Shared by both networking features.
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Cross-SDK compatibility check only (tests/cross_sdk.rs, all #[ignore]d).
# The full SDK ships the three registration templates as built-ins; this
# dependency exists purely to assert our vendored JSON hashes match it.
aqua-rs-sdk = { path = "../aqua-rs-sdk", features = ["native"] }
